events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream frontend {
        server frontend:3000;
    }

    upstream auth_service {
        server auth-service:8080;
    }

    upstream clan_service {
        server clan-service:8080;
    }

    # SPA. HTTPS обязателен для OIDC: browser session cookie не должна идти по HTTP.
    server {
        listen 5000 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certificates/localhost.pem;
        ssl_certificate_key /etc/nginx/certificates/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # AuthService целиком от корня issuer: OIDC (/connect, /.well-known) и JSON API (/auth/*).
    # `Host $http_host` сохраняет внешний порт 5001, который входит в OIDC issuer.
    server {
        listen 5001 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certificates/localhost.pem;
        ssl_certificate_key /etc/nginx/certificates/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Internal API сервисов (service-to-service) наружу не публикуется.
        location /internal/ {
            return 404;
        }

        # ClanService: /clans/* уходит в отдельный сервис.
        location /clans {
            proxy_pass http://clan_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location / {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }
}
